[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mnix"
version = "0.1.0"
description = "Stateless client/server remote development environments powered by Nix and Podman."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Avikant" }
]
dependencies = []

[project.scripts]
mnix = "mnix.client.cli:main"
mnix-server = "mnix.server.interfaces.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
