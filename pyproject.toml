[build-system]
requires = [
    "setuptools<59; python_version < \"3.9\"",
    "setuptools==82.0.1; python_version >= \"3.9\""
]
build-backend = "setuptools.build_meta"

[project]
name = "mnix"
version = "0.2.0"
description = "Stateless client/server remote development environments powered by Nix and Podman."
readme = "README.md"
requires-python = ">=3.7"
license = { text = "MIT" }
authors = [{ name = "Avikant Srivastava", email = "me@avikant.com" }]
dependencies = [
    "rich-click>=1.9.4; python_version >= \"3.8\"",
    "click; python_version < \"3.8\"",
    "rich==10.13.0; python_version < \"3.8\"",
    "tomli==1.2.3; python_version < \"3.8\"",
]

[project.scripts]
mnix = "mnix.client.cli:main"
mnix-server = "mnix.server.interfaces.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
